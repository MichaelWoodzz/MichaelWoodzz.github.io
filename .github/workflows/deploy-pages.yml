name: Deploy Vantage to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure public URL
        shell: bash
        run: |
          if [[ -n "${{ vars.CUSTOM_DOMAIN }}" ]]; then
            echo "NEXT_PUBLIC_SITE_URL=https://${{ vars.CUSTOM_DOMAIN }}" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_SITE_URL=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_ENV"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Add custom domain
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/client/CNAME
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify search engines with IndexNow
        continue-on-error: true
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{
              "host": "vantagesocal.com",
              "key": "7f4a23e8bc9d41a5b72ed8cf0310a964",
              "keyLocation": "https://vantagesocal.com/7f4a23e8bc9d41a5b72ed8cf0310a964.txt",
              "urlList": [
                "https://vantagesocal.com/",
                "https://vantagesocal.com/about/",
                "https://vantagesocal.com/how-it-works/",
                "https://vantagesocal.com/private-dating-advisor-los-angeles/",
                "https://vantagesocal.com/dating-coach-vs-matchmaker-los-angeles/",
                "https://vantagesocal.com/mens-image-consulting-los-angeles/",
                "https://vantagesocal.com/social-life-consulting-los-angeles/",
                "https://vantagesocal.com/private-wingman-los-angeles/",
                "https://vantagesocal.com/private-events-los-angeles/",
                "https://vantagesocal.com/southern-california-service-area/",
                "https://vantagesocal.com/privacy/"
              ]
            }'
